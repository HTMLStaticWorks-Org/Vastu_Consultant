<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login Portal | Vastu Harmony</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="description"
        content="Sign in to access your consultation bookings, property assessments and Vastu reports.">

    <!-- Google Fonts: Cormorant Garamond (Headings) + Manrope (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
</head>

<body data-theme="light" class="bg-primary-dark auth-page">

    <div class="container-fluid p-0 min-vh-100 d-flex flex-column justify-content-center align-items-center py-4">

        <div class="w-100 px-3" style="max-width: 480px;">

            <!-- Controls -->
            <div class="auth-top-controls d-flex justify-content-end gap-2 mb-3 z-index-3">
                <a href="#" id="rtlToggle"
                    class="btn btn-secondary-custom d-flex align-items-center justify-content-center fw-bold"
                    style="height: 40px; padding: 0 14px; font-size: 0.85rem;" title="Toggle RTL">RTL</a>
                <a href="#" id="themeToggle"
                    class="btn btn-secondary-custom d-flex align-items-center justify-content-center"
                    style="width: 40px; height: 40px;" title="Toggle Theme"><i class="bi bi-moon-stars fs-5"></i></a>
            </div>

            <div class="glass-card p-4 p-md-5 fade-up w-100">
                <div class="text-center mb-4">
                    <a class="navbar-brand justify-content-center mb-2 d-inline-flex align-items-center gap-2"
                        href="index.html">
                        <i class="bi bi-compass-fill fs-2 text-primary-accent"></i>
                        <span class="fs-3 fw-bold">Vastu <span class="text-primary-accent">Harmony</span></span>
                    </a>
                    <h4 class="fw-bold mt-3 mb-1">Welcome Back to Vastu Harmony</h4>
                    <p class="text-secondary small mb-0">Sign in to access your consultation bookings, property
                        assessments and Vastu reports.</p>
                </div>

                <form action="dashboard.html">
                    <div class="mb-3">
                        <label class="form-label text-secondary small">Email Address</label>
                        <input type="email" class="form-control form-control-glass"
                            placeholder="client@vastuharmony.com" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary small">Password</label>
                        <div class="position-relative">
                            <input type="password" class="form-control form-control-glass pe-5" id="loginPassword"
                                placeholder="••••••••" required>
                            <button type="button"
                                class="btn text-secondary position-absolute end-0 top-50 translate-middle-y me-2 p-0 border-0 bg-transparent"
                                onclick="togglePasswordVisibility('loginPassword', this)"
                                title="Toggle Password Visibility">
                                <i class="bi bi-eye-slash fs-5"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label text-secondary small" for="rememberMe">Remember Me</label>
                        </div>
                        <a href="#"
                            onclick="alert('Password reset instructions have been sent to your registered email address.');"
                            class="text-primary-accent text-decoration-none small fw-bold">Forgot Password</a>
                    </div>

                    <button type="submit" class="btn btn-primary-orange w-100 mb-3 fw-bold">Sign In</button>

                    <!-- Social Login Divider -->
                    <div class="d-flex align-items-center my-4">
                        <hr class="flex-grow-1 border-secondary my-0">
                        <span class="px-3 text-secondary small text-uppercase fw-semibold"
                            style="font-size: 0.75rem;">Or Sign In With</span>
                        <hr class="flex-grow-1 border-secondary my-0">
                    </div>

                    <!-- Social Login Buttons Row -->
                    <div class="row g-2 mb-3 align-items-stretch">
                        <div class="col-4 d-flex">
                            <button type="button"
                                class="btn btn-secondary-custom w-100 py-2 px-2 d-flex align-items-center justify-content-center gap-1 small fw-semibold text-nowrap"
                                onclick="window.location.href='dashboard.html';" title="Sign in with Google">
                                <i class="bi bi-google text-terracotta fs-6"></i> <span>Google</span>
                            </button>
                        </div>
                        <div class="col-4 d-flex">
                            <button type="button"
                                class="btn btn-secondary-custom w-100 py-2 px-2 d-flex align-items-center justify-content-center gap-1 small fw-semibold text-nowrap"
                                onclick="window.location.href='dashboard.html';" title="Sign in with Apple">
                                <i class="bi bi-apple fs-6"></i> <span>Apple</span>
                            </button>
                        </div>
                        <div class="col-4 d-flex">
                            <button type="button"
                                class="btn btn-secondary-custom w-100 py-2 px-2 d-flex align-items-center justify-content-center gap-1 small fw-semibold text-nowrap"
                                onclick="window.location.href='dashboard.html';" title="Sign in with Client ID">
                                <i class="bi bi-person-badge text-primary-accent fs-6"></i> <span>Client ID</span>
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-3">
                        <span class="text-secondary small">New to Vastu Harmony? <a href="register.html"
                                class="text-primary-accent text-decoration-none fw-bold">Create your client account to
                                get started.</a></span>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
